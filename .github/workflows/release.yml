# Publishes a release when a version tag is pushed, for example v1.0.0 or v1.0.0-rc.1.
#   1. Runs the whole CI workflow (ci.yml): backend, desktop, end-to-end and installer smoke tests.
#   2. Only if every test passed: builds the Windows installer with the version from the tag
#      and creates a GitHub Release for the tag with the installer attached.
# Tags with a "-" (v1.0.0-rc.1, v1.0.0-beta.2) become pre-releases.
# Only GitHub's own GITHUB_TOKEN is used; no other secrets.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Never cancel a release half-way; a second push of the same tag waits.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: All tests
    uses: ./.github/workflows/ci.yml

  release:
    name: Build installer and publish the release
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 30
    # Creating a release needs write access to the repository contents (only for this job).
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Read the version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a version tag like v1.0.0 or v1.0.0-rc.1."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install desktop dependencies
        run: npm ci
      # Only on this runner, never committed: the installer gets the tag's version.
      # The backend jar is found by name prefix (scripts/prepare-backend.js), so its own version does not matter.
      - name: Set the app version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
      # Builds the app, the backend jar and its jlink runtime, then the NSIS installer (dist/).
      - name: Build the installer
        run: npm run dist
      # GitHub replaces spaces in asset names with dots, so the file gets a name without spaces.
      - name: Name the installer
        id: asset
        run: |
          SRC="dist/Dockline Setup ${{ steps.version.outputs.version }}.exe"
          DEST="dist/Dockline-Setup-${{ steps.version.outputs.version }}.exe"
          test -f "$SRC" || { echo "::error::Installer not found: $SRC"; ls dist; exit 1; }
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" "${{ steps.asset.outputs.path }}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Dockline $VERSION" \
            --notes-file ../docs/release-notes.md \
            "${FLAGS[@]}"
