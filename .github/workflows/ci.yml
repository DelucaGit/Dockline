# Builds and tests everything on every pull request and on pushes to main.
# Only fake external APIs are used (WireMock); no secrets or real tokens are needed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build + tests
    # Plain Java, so the cheaper and faster Linux runner is enough.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Runs the tests and exports openapi.json (starts the app briefly on port 18089;
      # nothing else runs on a fresh CI machine, so the port is free).
      - name: Build and test
        run: ./mvnw -B -ntp verify
      - name: Check that the committed openapi.json is up to date
        run: |
          git diff --exit-code -- openapi.json || {
            echo "::error file=backend/openapi.json::openapi.json is out of date. Run './mvnw verify' in backend/ and commit the result."
            exit 1
          }

  desktop:
    name: Desktop typecheck, build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    env:
      # Unit tests and the build do not run Electron itself.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Check that the generated API types match openapi.json
        run: |
          npm run generate:api
          git diff --exit-code -- src/renderer/src/api/schema.d.ts || {
            echo "::error file=desktop/src/renderer/src/api/schema.d.ts::schema.d.ts is out of date. Run 'npm run generate:api' in desktop/ and commit the result."
            exit 1
          }
      - name: Typecheck and build
        run: npm run build
      - name: Unit tests (Vitest)
        run: npm test

  e2e:
    name: End-to-end tests (Windows)
    # Dockline is a Windows app (and stops its backend with taskkill), so the
    # end-to-end tests run on Windows: real Electron window, real Java backend.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # Tests ran in the backend job; here only the jar is needed.
      - name: Build the backend jar
        working-directory: backend
        run: ./mvnw -B -ntp -DskipTests package
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      # setup-java sets JAVA_HOME, which the app and the WireMock helper use to find Java 25.
      - name: Build the app and run the end-to-end tests (Playwright)
        working-directory: desktop
        run: npm run test:e2e
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: desktop/test-results/
          if-no-files-found: ignore
