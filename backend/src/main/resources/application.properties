spring.application.name=dockline-backend

# Listen on localhost only. The port is chosen at start-up: --server.port=PORT or SERVER_PORT=PORT (0 = any free port).
server.address=127.0.0.1
server.port=${SERVER_PORT:8080}

# Only the health endpoint is exposed by Actuator: GET /actuator/health -> {"status":"UP"}
management.endpoints.web.exposure.include=health

# OpenAPI description: GET /v3/api-docs (JSON), Swagger UI at /swagger-ui.html

# External API base URLs. The defaults are the real APIs; tests override them to point at WireMock,
# with --dockline.github.api-url=... or the environment variables below (no trailing slash).
dockline.github.api-url=${DOCKLINE_GITHUB_API_URL:https://api.github.com}
dockline.github.oauth-url=${DOCKLINE_GITHUB_OAUTH_URL:https://github.com}
# Client ID of the GitHub OAuth App used by "Connect to GitHub" (device flow, no client secret).
# Empty by default: connecting then fails with "GitHub client ID is not configured".
# Set with DOCKLINE_GITHUB_CLIENT_ID=... (see docs/github-oauth-app-setup.md).
dockline.github.client-id=${DOCKLINE_GITHUB_CLIENT_ID:}
dockline.hostinger.api-url=${DOCKLINE_HOSTINGER_API_URL:https://developers.hostinger.com}
# How long to wait when Hostinger answers 429 (too many requests) without a readable Retry-After header
# (a number of seconds or an HTTP date). Hostinger's own Retry-After is used when present, kept within 1-120 s.
dockline.hostinger.default-retry-after=${DOCKLINE_HOSTINGER_DEFAULT_RETRY_AFTER:30s}
# How long to wait for Hostinger's answer once connected; a slower answer is reported as "took too long".
dockline.hostinger.read-timeout=${DOCKLINE_HOSTINGER_READ_TIMEOUT:30s}

# Log files: dockline.log in this folder, rolled daily and at 10 MB, kept 14 days / 100 MB at most
# (see logback-spring.xml). Default: %APPDATA%\Dockline\logs on Windows, ~/.local/share/Dockline/logs elsewhere.
# Override with --dockline.log.dir=... or DOCKLINE_LOG_DIR (tests use a temporary folder).
dockline.log.dir=${DOCKLINE_LOG_DIR:${APPDATA:${user.home}/.local/share}/Dockline/logs}

# Settings file: settings.json in this folder (versioned JSON; holds the manual site-repo links).
# Default: %APPDATA%\Dockline on Windows, ~/.local/share/Dockline elsewhere.
# Override with --dockline.settings.dir=... or DOCKLINE_SETTINGS_DIR (tests use a temporary folder).
dockline.settings.dir=${DOCKLINE_SETTINGS_DIR:${APPDATA:${user.home}/.local/share}/Dockline}

# Shown as "app version" in log entries; filled in from pom.xml by the build.
dockline.app-version=@project.version@

# Test-only endpoints (POST /api/test/...) used by the end-to-end tests to make the backend report errors.
# OFF by default and never part of the API description; turn on with DOCKLINE_TEST_ENDPOINTS=true.
dockline.test-endpoints=${DOCKLINE_TEST_ENDPOINTS:false}

# Where GitHub/Hostinger tokens are kept: credential-manager (Windows Credential Manager, service "Dockline",
# survives restarts) or memory (forgotten on exit; used by tests). Override with DOCKLINE_TOKEN_STORE=memory.
dockline.token-store=${DOCKLINE_TOKEN_STORE:credential-manager}
