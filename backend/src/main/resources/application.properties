spring.application.name=dockline-backend

# Listen on localhost only. The port is chosen at start-up: --server.port=PORT or SERVER_PORT=PORT (0 = any free port).
server.address=127.0.0.1
server.port=${SERVER_PORT:8080}

# Only the health endpoint is exposed by Actuator: GET /actuator/health -> {"status":"UP"}
management.endpoints.web.exposure.include=health

# OpenAPI description: GET /v3/api-docs (JSON), Swagger UI at /swagger-ui.html

# External API base URLs. The defaults are the real APIs; tests override them to point at WireMock,
# with --dockline.github.api-url=... or the environment variables below (no trailing slash).
dockline.github.api-url=${DOCKLINE_GITHUB_API_URL:https://api.github.com}
dockline.github.oauth-url=${DOCKLINE_GITHUB_OAUTH_URL:https://github.com}
dockline.hostinger.api-url=${DOCKLINE_HOSTINGER_API_URL:https://developers.hostinger.com}
